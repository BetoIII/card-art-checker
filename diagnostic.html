<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain — Iframe Diagnostic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Reddit+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/tokens.css?v=2">
  <link rel="stylesheet" href="/assets/components.css?v=3">
  <style>
    body { padding: 24px; }
    h1 { font-size: var(--cc-fs-d-xs); font-weight: 600; margin-bottom: 20px; }
    pre {
      background: var(--cc-surface);
      border: 1px solid var(--cc-border);
      border-radius: var(--cc-r-md);
      padding: 16px;
      overflow-x: auto;
      font-family: var(--cc-mono);
      font-size: var(--cc-fs-sm);
      color: var(--cc-text);
    }
    .section { margin-bottom: 20px; }
    .label { font-weight: 600; color: var(--cc-text-2); margin-bottom: 4px; font-size: var(--cc-fs-sm); }
  </style>
  <link rel="stylesheet" href="/assets/nav.css">
  <script src="/assets/nav.js" data-tag="Diagnostic" data-auto-theme></script>

</head>
<body>
  <h1>Rocketlane Iframe Diagnostic</h1>
  <div class="section">
    <div class="label">Full URL:</div>
    <pre id="url"></pre>
  </div>
  <div class="section">
    <div class="label">Query Parameters:</div>
    <pre id="params"></pre>
  </div>
  <div class="section">
    <div class="label">Referrer:</div>
    <pre id="referrer"></pre>
  </div>
  <div class="section">
    <div class="label">Embedded in iframe:</div>
    <pre id="iframe"></pre>
  </div>
  <script>
    document.getElementById('url').textContent = location.href;
    document.getElementById('params').textContent = JSON.stringify(
      Object.fromEntries(new URLSearchParams(location.search)), null, 2
    );
    document.getElementById('referrer').textContent = document.referrer || '(empty)';
    document.getElementById('iframe').textContent = String(window.self !== window.top);
  </script>
</body>
</html>
