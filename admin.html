<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain — Card Art Checker Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Reddit+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/tokens.css?v=2">
  <link rel="stylesheet" href="/assets/components.css?v=3">
  <style>
    /* Page layout only — tokens.css + components.css carry the design system. */

    body { padding: 24px; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      padding-top: 20px;
    }
    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--cc-grad);
      border-radius: 2px;
    }
    /* The shared nav carries this accent at the top of the window, so the
       container's own bar would double it. Keyed to the class nav.js sets:
       when the page is framed (no bar) this bar is still the page's accent. */
    html.rn-nav-on .container::before { display: none; }

    .page-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    h1 { font-size: var(--cc-fs-d-sm); font-weight: 600; line-height: 1.25; }
    .page-head .sub {
      font-size: var(--cc-fs-xs);
      font-variant-numeric: tabular-nums;
      color: var(--cc-text-3);
      letter-spacing: var(--cc-track-sm);
    }

    /* ── Service status ─────────────────────────────────────── */
    .status-card {
      background: var(--cc-surface);
      border: 1px solid var(--cc-border);
      border-radius: var(--cc-r-xl);
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--cc-border-strong);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--cc-success); box-shadow: 0 0 0 4px var(--cc-success-bg); }
    .status-dot.warn { background: var(--cc-warning); box-shadow: 0 0 0 4px var(--cc-warning-bg); }
    .status-dot.down { background: var(--cc-error); box-shadow: 0 0 0 4px var(--cc-error-bg); }
    .status-label { font-size: var(--cc-fs-md); font-weight: 600; }
    .status-meta {
      margin-left: auto;
      font-size: var(--cc-fs-xs);
      font-variant-numeric: tabular-nums;
      color: var(--cc-text-3);
      letter-spacing: var(--cc-track-sm);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .env-chips {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .env-chip {
      font-family: var(--cc-mono);
      font-size: var(--cc-fs-xs);
      font-weight: 500;
      padding: 2px 10px;
      border-radius: var(--cc-r-pill);
      border: 1px solid var(--cc-border-strong);
      color: var(--cc-text-2);
    }
    .env-chip.ok { border-color: var(--cc-success); color: var(--cc-success-text); background: var(--cc-success-bg); }
    .env-chip.missing { border-color: var(--cc-error); color: var(--cc-error-text); background: var(--cc-error-bg); }

    /* ── Overview (brand KPI cards) ─────────────────────────── */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .kpi {
      background: var(--cc-surface);
      border: 1px solid var(--cc-border);
      border-radius: var(--cc-r-lg);
      padding: 16px 18px;
    }
    .kpi-value {
      font-size: var(--cc-fs-d-sm);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .kpi-label { margin-top: 6px; font-size: var(--cc-fs-sm); color: var(--cc-text-2); }
    .kpi-sub {
      margin-top: 2px;
      font-size: var(--cc-fs-xs);
      letter-spacing: var(--cc-track-sm);
      color: var(--cc-text-3);
      font-variant-numeric: tabular-nums;
    }
    .kpi.alert .kpi-value { color: var(--cc-error-text); }
    .kpi-scope {
      margin: 8px 0 28px;
      font-size: var(--cc-fs-xs);
      letter-spacing: var(--cc-track-sm);
      color: var(--cc-text-3);
    }

    /* ── Runs ───────────────────────────────────────────────── */
    .runs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .runs-head h2 { font-size: var(--cc-fs-lg); font-weight: 600; }
    .refresh-btn, .clear-btn {
      appearance: none;
      border: 1px solid var(--cc-border-strong);
      background: var(--cc-surface);
      color: var(--cc-text-2);
      font-family: var(--cc-font);
      font-size: var(--cc-fs-sm);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--cc-r-md);
      cursor: pointer;
      transition: border-color var(--cc-transition), color var(--cc-transition);
    }
    .refresh-btn:disabled { cursor: progress; opacity: 0.6; }
    .refresh-btn:hover, .clear-btn:hover { border-color: var(--cc-text); color: var(--cc-text); }

    /* ── Search + filter pills (brand Search & Filters) ─────── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search {
      position: relative;
      flex: 1 1 260px;
      min-width: 0;
    }
    .search svg {
      position: absolute;
      left: 12px; top: 50%;
      width: 16px; height: 16px;
      transform: translateY(-50%);
      color: var(--cc-text-3);
      pointer-events: none;
    }
    .search input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      font-family: var(--cc-font);
      font-size: var(--cc-fs-sm);
      color: var(--cc-text);
      background: var(--cc-surface);
      border: 1px solid var(--cc-border-strong);
      border-radius: var(--cc-r-md);
      transition: border-color var(--cc-transition), box-shadow var(--cc-transition);
    }
    .search input::placeholder { color: var(--cc-text-3); }
    .search input:focus { outline: none; border-color: var(--cc-blue-deep); box-shadow: var(--cc-ring-blue); }
    .filter-label {
      font-size: var(--cc-fs-sm);
      color: var(--cc-text-3);
      margin-left: 4px;
    }
    .pill-select { position: relative; display: inline-flex; }
    .pill-select select {
      appearance: none;
      padding: 7px 30px 7px 12px;
      font-family: var(--cc-font);
      font-size: var(--cc-fs-sm);
      font-weight: 500;
      color: var(--cc-text-2);
      background: var(--cc-surface);
      border: 1px solid var(--cc-border-strong);
      border-radius: var(--cc-r-md);
      cursor: pointer;
      transition: border-color var(--cc-transition), color var(--cc-transition);
    }
    .pill-select select:hover { border-color: var(--cc-text); color: var(--cc-text); }
    .pill-select select.is-set { border-color: var(--cc-text); color: var(--cc-text); font-weight: 600; }
    /* Chevron drawn in CSS so it follows the theme's text color. */
    .pill-select::after {
      content: '';
      position: absolute;
      right: 12px; top: 50%;
      width: 6px; height: 6px;
      margin-top: -5px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      color: var(--cc-text-3);
      pointer-events: none;
    }

    .table-wrap {
      background: var(--cc-surface);
      border: 1px solid var(--cc-border);
      border-radius: var(--cc-r-lg);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--cc-fs-sm);
    }
    /* Brand data table: small uppercase gray header over a bottom rule. */
    thead th {
      text-align: left;
      font-size: var(--cc-fs-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: var(--cc-track-sm);
      color: var(--cc-text-2);
      padding: 12px;
      border-bottom: 1px solid var(--cc-border-strong);
      white-space: nowrap;
    }
    tbody tr.run-row:first-child { border-top: none; }
    tbody tr.run-row {
      border-top: 1px solid var(--cc-border);
      cursor: pointer;
    }
    tbody tr.run-row:hover { background: var(--cc-surface-2); }
    tbody td {
      padding: 10px 12px;
      vertical-align: top;
      white-space: nowrap;
    }
    td.wrap { white-space: normal; max-width: 260px; overflow-wrap: anywhere; }

    /* Row badges: stratus Tag triples, keyed by the classes the JS emits. */
    .badge {
      display: inline-block;
      font-size: var(--cc-fs-xs);
      font-weight: 600;
      letter-spacing: 0.2px;
      padding: 2px 10px;
      border-radius: var(--cc-r-pill);
      white-space: nowrap;
      background: var(--cc-surface-2);
      color: var(--cc-text-2);
    }
    .badge.src-rocketlane { background: var(--cc-info-bg); color: var(--cc-info-text); }
    .badge.src-dock { background: var(--cc-pink-soft); color: var(--cc-link); }
    .badge.src-upload { background: var(--cc-success-bg); color: var(--cc-success-text); }
    .badge.src-api { background: var(--cc-blue-soft); color: var(--cc-text-2); }

    .badge.st-running { background: var(--cc-info-bg); color: var(--cc-info-text); }
    .badge.st-completed { background: var(--cc-success-bg); color: var(--cc-success-text); }
    .badge.st-failed { background: var(--cc-error-bg); color: var(--cc-error-text); }
    .badge.st-skipped { background: var(--cc-surface-2); color: var(--cc-text-3); }

    .badge.v-pass { background: var(--cc-success-bg); color: var(--cc-success-text); }
    .badge.v-fail { background: var(--cc-error-bg); color: var(--cc-error-text); }

    .pulse {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 5px;
      animation: pulse 1.2s ease-in-out infinite;
      vertical-align: 1px;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .badge.v-notes { background: var(--cc-warning-bg); color: var(--cc-warning-text); }

    .expand-btn {
      appearance: none;
      background: none;
      border: none;
      color: var(--cc-text-3);
      cursor: pointer;
      font-size: var(--cc-fs-xs);
      padding: 2px 6px 2px 0;
      vertical-align: baseline;
    }

    .muted { color: var(--cc-text-3); }
    a.report-link { color: var(--cc-link); font-weight: 600; text-decoration: none; }
    a.report-link:hover { text-decoration: underline; }

    /* Expanded detail */
    tr.detail-row td {
      background: var(--cc-surface-2);
      border-top: 1px solid var(--cc-border);
      padding: 14px 16px 18px;
      white-space: normal;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .detail-block h3 {
      font-size: var(--cc-fs-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: var(--cc-track-sm);
      color: var(--cc-text-2);
      margin-bottom: 6px;
    }
    .kv { font-size: var(--cc-fs-sm); line-height: 1.6; overflow-wrap: anywhere; }
    .kv b { font-weight: 600; }
    .timeline { list-style: none; font-size: var(--cc-fs-xs); letter-spacing: 0.2px; }
    .timeline li {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      align-items: baseline;
    }
    .timeline .t { font-size: var(--cc-fs-xs); font-variant-numeric: tabular-nums; color: var(--cc-text-3); flex-shrink: 0; }
    .timeline .icon { width: 14px; text-align: center; flex-shrink: 0; }
    .timeline .icon.done { color: var(--cc-success); }
    .timeline .icon.pending { color: var(--cc-warning); }
    .timeline .icon.error { color: var(--cc-error); }
    .error-box {
      margin-top: 4px;
      font-family: var(--cc-mono);
      font-size: var(--cc-fs-xs);
      color: var(--cc-error-text);
      background: var(--cc-error-bg);
      border: 1px solid var(--cc-error);
      border-radius: var(--cc-r-md);
      padding: 8px 10px;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 32px;
      text-align: center;
      font-size: var(--cc-fs-sm);
      color: var(--cc-text-3);
    }
    .empty .clear-btn { margin-left: 8px; }

    @media (max-width: 640px) {
      body { padding: 16px 12px; }
    }
  </style>
  <link rel="stylesheet" href="/assets/nav.css">
  <script src="/assets/nav.js" data-tag="Admin" data-auto-theme></script>

</head>
<body>
  <div class="container">
    <div class="page-head">
      <h1>Card Art Checker — Admin</h1>
      <span class="sub" id="refresh-note">loading…</span>
    </div>

    <!-- Service status -->
    <div class="status-card" id="status-card">
      <div class="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Checking…</span>
        <span class="status-meta" id="status-meta"></span>
      </div>
      <div class="env-chips" id="env-chips"></div>
    </div>

    <!-- Overview: figures for whatever the filters below leave in view -->
    <section aria-label="Run overview">
      <div class="kpis" id="kpis"></div>
      <p class="kpi-scope" id="kpi-scope"></p>
    </section>

    <!-- Run log -->
    <div class="runs-head">
      <h2>Runs</h2>
      <button type="button" class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>
    <div class="filter-bar" role="search">
      <label class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input type="search" id="f-q" placeholder="Search project, file or run ID" aria-label="Search runs" autocomplete="off">
      </label>
      <span class="filter-label" aria-hidden="true">Filter by</span>
      <span class="pill-select">
        <select id="f-source" aria-label="Filter by source">
          <option value="">All sources</option>
          <option value="rocketlane">Rocketlane webhook</option>
          <option value="dock">Dock webhook</option>
          <option value="upload">Manual upload</option>
          <option value="api">Server-to-server</option>
        </select>
      </span>
      <span class="pill-select">
        <select id="f-verdict" aria-label="Filter by verdict">
          <option value="">All verdicts</option>
          <option value="approved">Approved</option>
          <option value="approved_with_notes">With notes</option>
          <option value="requires_changes">Requires changes</option>
          <option value="error">Error</option>
          <option value="none">No verdict</option>
        </select>
      </span>
      <span class="pill-select">
        <select id="f-status" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="running">Running</option>
          <option value="completed">Completed</option>
          <option value="failed">Failed</option>
          <option value="skipped">Skipped</option>
        </select>
      </span>
      <button type="button" class="clear-btn" id="f-clear" hidden>Clear</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Started</th>
            <th>Source</th>
            <th>Project</th>
            <th>File</th>
            <th>Type</th>
            <th>Verdict</th>
            <th>Status</th>
            <th>Duration</th>
            <th>Report</th>
          </tr>
        </thead>
        <tbody id="runs-body">
          <tr><td colspan="9" class="empty">Loading runs…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const REFRESH_SECS = 30;
    // Env vars required for the pipeline to run; Slack is optional (delivery
    // degrades to 'skipped'), Dock secret only gates the Dock webhook.
    const REQUIRED_ENV = ['ROCKETLANE_API_KEY', 'ROCKETLANE_WEBHOOK_SECRET', 'ANTHROPIC_API_KEY', 'AGENT_ID', 'ENV_ID', 'SPEC_SCRIPT_FILE_ID', 'BLOB_READ_WRITE_TOKEN'];
    const OPTIONAL_ENV = ['SLACK_BOT_TOKEN', 'DOCK_WEBHOOK_SECRET'];

    const SOURCE_LABELS = {
      rocketlane: 'Rocketlane webhook',
      dock: 'Dock webhook',
      upload: 'Manual upload',
      api: 'Server-to-server',
    };

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function relTime(iso) {
      if (!iso) return '—';
      const diff = Date.now() - new Date(iso).getTime();
      const s = Math.round(diff / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.round(m / 60);
      if (h < 48) return `${h}h ago`;
      return `${Math.round(h / 24)}d ago`;
    }
    const absTime = (iso) => iso ? new Date(iso).toLocaleString() : '—';
    const clockTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour12: false }) : '';

    function fmtMs(ms) {
      if (ms == null) return '—';
      if (ms < 1000) return `${ms}ms`;
      const s = ms / 1000;
      if (s < 90) return `${s.toFixed(s < 10 ? 1 : 0)}s`;
      return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
    }
    const fmtDuration = (run) =>
      fmtMs(run.durationMs ?? (run.status === 'running' && run.startedAt ? Date.now() - new Date(run.startedAt).getTime() : null));

    // One result's verdict: 'error', a three-state outcome, or null when it has
    // none. Older runs only carry pass/fail.
    function resultOutcome(r) {
      if (r.error) return 'error';
      return r.outcome || (r.status === 'pass' ? 'approved' : r.status === 'fail' ? 'requires_changes' : null);
    }
    const VERDICT_BADGES = {
      approved: ['v-pass', 'Approved'],
      approved_with_notes: ['v-notes', 'With notes'],
      requires_changes: ['v-fail', 'Requires changes'],
      error: ['v-fail', 'Error'],
    };
    const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);

    // ── Service status ──────────────────────────────────────
    async function loadHealth() {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      const meta = document.getElementById('status-meta');
      const chips = document.getElementById('env-chips');
      const t0 = performance.now();
      try {
        const res = await fetch('/api/health', { cache: 'no-store' });
        const latency = Math.round(performance.now() - t0);
        const health = await res.json();
        const env = health.env || {};
        const missing = REQUIRED_ENV.filter((k) => !env[k]);

        if (!res.ok || !health.ok) {
          dot.className = 'status-dot down'; label.textContent = 'Service down';
        } else if (missing.length) {
          dot.className = 'status-dot warn'; label.textContent = 'Degraded — missing configuration';
        } else {
          dot.className = 'status-dot ok'; label.textContent = 'Operational';
        }
        meta.innerHTML = `<span>API latency ${latency}ms</span><span>checked ${new Date().toLocaleTimeString()}</span>`;
        chips.innerHTML = [...REQUIRED_ENV, ...OPTIONAL_ENV.filter((k) => k in env)]
          .map((k) => {
            const ok = !!env[k];
            const optional = OPTIONAL_ENV.includes(k);
            return `<span class="env-chip ${ok ? 'ok' : 'missing'}" title="${optional ? 'optional' : 'required'}">${esc(k)}${ok ? '' : optional ? ' (optional, unset)' : ' MISSING'}</span>`;
          }).join('');
      } catch (err) {
        dot.className = 'status-dot down';
        label.textContent = 'Service unreachable';
        meta.innerHTML = `<span>${esc(err.message)}</span>`;
        chips.innerHTML = '';
      }
    }

    // ── Runs ────────────────────────────────────────────────
    let expanded = new Set();

    function sourceBadge(run) {
      const src = SOURCE_LABELS[run.source] ? run.source : 'unknown';
      return `<span class="badge src-${src}">${esc(SOURCE_LABELS[run.source] || run.source || 'unknown')}</span>`;
    }

    function statusBadge(run) {
      const st = ['running', 'completed', 'failed', 'skipped'].includes(run.status) ? run.status : 'running';
      const pulse = st === 'running' ? '<span class="pulse"></span>' : '';
      return `<span class="badge st-${st}">${pulse}${esc(cap(run.status))}</span>`;
    }

    function verdictBadge(run) {
      if (!run.results || !run.results.length) return '<span class="muted">—</span>';
      return run.results.map((r) => {
        const badge = VERDICT_BADGES[resultOutcome(r)];
        return badge
          ? `<span class="badge ${badge[0]}">${badge[1]}</span>`
          : `<span class="badge">${esc(cap(r.status) || '—')}</span>`;
      }).join(' ');
    }

    function runFile(run) {
      if (run.selected) return run.selected.filename;
      if (run.file) return run.file;
      if (run.results?.length) return run.results.map((r) => r.filename).filter(Boolean).join(', ');
      if (run.downloads?.length) return run.downloads.map((d) => d.filename).filter(Boolean).join(', ');
      if (run.attachmentResolution?.files?.length) return run.attachmentResolution.files.map((f) => f.filename).join(', ');
      return '';
    }

    function runProject(run) {
      if (run.projectName) return `${run.projectName} (${run.projectId ?? '?'})`;
      if (run.projectId) return `project ${run.projectId}`;
      if (run.dock) return [run.dock.workspace, run.dock.account ? `acct ${run.dock.account}` : null].filter(Boolean).join(' — ') || '—';
      return '—';
    }

    function reportLinks(run) {
      const links = (run.results || []).filter((r) => r.pdfUrl)
        .map((r) => `<a class="report-link" href="${esc(r.pdfUrl)}" target="_blank" rel="noopener">PDF</a>`);
      return links.length ? links.join(' ') : '<span class="muted">—</span>';
    }

    function detailHtml(run) {
      const blocks = [];

      const trig = run.trigger || {};
      blocks.push(`<div class="detail-block"><h3>Trigger</h3><div class="kv">
        <b>Source:</b> ${esc(SOURCE_LABELS[run.source] || run.source)}<br>
        <b>Endpoint:</b> ${esc(trig.endpoint || '—')}<br>
        ${trig.description ? `<b>Via:</b> ${esc(trig.description)}<br>` : ''}
        ${trig.eventId ? `<b>Event:</b> ${esc(trig.eventId)}<br>` : ''}
        ${trig.occurredAt ? `<b>Occurred:</b> ${esc(trig.occurredAt)}<br>` : ''}
        ${trig.userAgent ? `<b>User-Agent:</b> ${esc(trig.userAgent)}<br>` : ''}
        <b>Run ID:</b> ${esc(run.runId)}<br>
        <b>Started:</b> ${esc(absTime(run.startedAt))}
      </div></div>`);

      if (run.dock) {
        blocks.push(`<div class="detail-block"><h3>Dock submission</h3><div class="kv">
          ${run.dock.workspace ? `<b>Workspace:</b> ${esc(run.dock.workspace)}<br>` : ''}
          ${run.dock.account ? `<b>Account:</b> ${esc(run.dock.account)}<br>` : ''}
          ${run.dock.user ? `<b>User:</b> ${esc(run.dock.user)}<br>` : ''}
          ${run.dock.form ? `<b>Form:</b> ${esc(run.dock.form)}` : ''}
        </div></div>`);
      }

      if (run.attachmentResolution) {
        const ar = run.attachmentResolution;
        const files = ar.files ? ar.files.map((f) => `${f.attachmentId}: ${esc(f.filename)}`).join('<br>') : (ar.ids || []).join(', ');
        blocks.push(`<div class="detail-block"><h3>Attachment resolution</h3><div class="kv">
          <b>Mode:</b> ${esc(ar.mode)}${ar.taskId ? ` (task ${esc(ar.taskId)})` : ''}<br>${files}
        </div></div>`);
      }

      if (run.downloads?.length) {
        blocks.push(`<div class="detail-block"><h3>Downloads</h3><div class="kv">${run.downloads.map((d) =>
          d.ok
            ? `✓ ${d.attachmentId ? `${esc(d.attachmentId)}: ` : ''}${esc(d.filename)} (${(d.bytes / 1024).toFixed(0)} KB)`
            : `✗ ${d.attachmentId ? `${esc(d.attachmentId)}: ` : ''}${esc(d.error || 'failed')}`
        ).join('<br>')}</div></div>`);
      }

      if (run.selected) {
        blocks.push(`<div class="detail-block"><h3>Selected card art</h3><div class="kv">
          ${esc(run.selected.filename)}${run.selected.width ? ` (${run.selected.width}×${run.selected.height})` : ''}
          ${run.selected.attachmentId ? `<br><b>Attachment:</b> ${esc(run.selected.attachmentId)}` : ''}
        </div></div>`);
      }

      if (run.results?.length) {
        blocks.push(`<div class="detail-block"><h3>Results</h3><div class="kv">${run.results.map((r) => {
          if (r.error) return `✗ ${esc(r.filename || r.attachmentId || '')}: <span style="color: var(--cc-error)">${esc(r.error)}</span>`;
          const delivery = r.delivery ? `<br><b>Delivery:</b> ${esc(typeof r.delivery === 'string' ? r.delivery : Object.entries(r.delivery).filter(([, v]) => v != null).map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(', '))}` : '';
          const outcome = r.outcome || (r.status === 'pass' ? 'approved' : 'requires_changes');
          const verdict = outcome === 'approved' ? 'Approved' : outcome === 'approved_with_notes' ? 'Approved with notes' : 'Requires changes';
          const resultUrl = r.resultUrl ? `<br><b>Result:</b> ${esc(r.resultUrl)} <span class="muted">(needs the webhook secret)</span>` : '';
          return `<b>${esc(r.filename || r.attachmentId || '')}</b> — ${verdict}<br>${esc(r.summary || '')}${r.pdfUrl ? `<br><a class="report-link" href="${esc(r.pdfUrl)}" target="_blank" rel="noopener">Open PDF report</a>` : ''}${resultUrl}${delivery}`;
        }).join('<hr style="border:0;border-top:1px solid var(--cc-border);margin:8px 0">')}</div></div>`);
      }

      if (run.events?.length) {
        blocks.push(`<div class="detail-block"><h3>Timeline</h3><ul class="timeline">${run.events.map((e) => {
          const cls = e.status === 'done' ? 'done' : e.status === 'error' ? 'error' : 'pending';
          const icon = e.status === 'done' ? '✓' : e.status === 'error' ? '✗' : '◌';
          return `<li><span class="t">${esc(clockTime(e.t))}</span><span class="icon ${cls}">${icon}</span><span><b>${esc(e.step)}</b> — ${esc(e.message)}</span></li>`;
        }).join('')}</ul></div>`);
      }

      if (run.error) blocks.push(`<div class="detail-block"><h3>Error</h3><div class="error-box">${esc(run.error)}</div></div>`);
      if (run.skipReason) blocks.push(`<div class="detail-block"><h3>Skipped</h3><div class="kv">${esc(run.skipReason)}</div></div>`);

      return `<div class="detail-grid">${blocks.join('')}</div>`;
    }

    // ── Filters ─────────────────────────────────────────────
    // Held here, not read back from the inputs on render, and the inputs are
    // never rebuilt — so a filter (and focus inside it) survives the refresh.
    const filters = { q: '', source: '', verdict: '', status: '' };
    const filterEls = {
      q: document.getElementById('f-q'),
      source: document.getElementById('f-source'),
      verdict: document.getElementById('f-verdict'),
      status: document.getElementById('f-status'),
    };
    const clearBtn = document.getElementById('f-clear');
    const filtersActive = () => Object.values(filters).some(Boolean);

    function matchesFilters(run) {
      if (filters.source && run.source !== filters.source) return false;
      if (filters.status && run.status !== filters.status) return false;
      if (filters.verdict) {
        const outcomes = (run.results || []).map(resultOutcome).filter(Boolean);
        if (filters.verdict === 'none' ? outcomes.length : !outcomes.includes(filters.verdict)) return false;
      }
      if (filters.q) {
        const haystack = [run.runId, run.projectId, run.projectName, runFile(run), run.dock?.workspace, run.dock?.account]
          .filter((v) => v != null).join(' ').toLowerCase();
        if (!haystack.includes(filters.q)) return false;
      }
      return true;
    }

    function syncFilterUi() {
      filterEls.source.classList.toggle('is-set', !!filters.source);
      filterEls.verdict.classList.toggle('is-set', !!filters.verdict);
      filterEls.status.classList.toggle('is-set', !!filters.status);
      clearBtn.hidden = !filtersActive();
    }

    function clearFilters() {
      Object.keys(filters).forEach((k) => { filters[k] = ''; filterEls[k].value = ''; });
      syncFilterUi();
      renderRuns();
    }

    filterEls.q.addEventListener('input', () => { filters.q = filterEls.q.value.trim().toLowerCase(); syncFilterUi(); renderRuns(); });
    ['source', 'verdict', 'status'].forEach((k) =>
      filterEls[k].addEventListener('change', () => { filters[k] = filterEls[k].value; syncFilterUi(); renderRuns(); }));
    clearBtn.addEventListener('click', clearFilters);

    // ── Overview ────────────────────────────────────────────
    function renderKpis(runs) {
      const verdicts = runs.flatMap((r) => (r.results || []).map(resultOutcome)).filter((o) => o && o !== 'error');
      const approved = verdicts.filter((o) => o === 'approved' || o === 'approved_with_notes').length;
      const durations = runs.filter((r) => r.status === 'completed' && r.durationMs != null)
        .map((r) => r.durationMs).sort((a, b) => a - b);
      const median = durations.length
        ? (durations.length % 2 ? durations[(durations.length - 1) / 2]
          : Math.round((durations[durations.length / 2 - 1] + durations[durations.length / 2]) / 2))
        : null;
      const failures = runs.filter((r) => r.status === 'failed' || (r.results || []).some((x) => x.error)).length;
      const running = runs.filter((r) => r.status === 'running').length;

      const tile = (value, label, sub, cls = '') =>
        `<div class="kpi ${cls}"><div class="kpi-value">${value}</div><div class="kpi-label">${label}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
      document.getElementById('kpis').innerHTML = [
        tile(runs.length, 'Runs', running ? `${running} running now` : ''),
        tile(verdicts.length ? `${Math.round((approved / verdicts.length) * 100)}%` : '—', 'Approval rate',
          verdicts.length ? `${approved} of ${verdicts.length} verdicts` : 'no verdicts yet'),
        tile(esc(fmtMs(median)), 'Median duration', durations.length ? `${durations.length} completed run${durations.length === 1 ? '' : 's'}` : 'no completed runs'),
        tile(failures, 'Failures', runs.length ? `of ${runs.length} run${runs.length === 1 ? '' : 's'}` : '', failures ? 'alert' : ''),
      ].join('');
      document.getElementById('kpi-scope').textContent = filtersActive()
        ? `Across the ${runs.length} of ${lastRuns.length} loaded runs that match the filters.`
        : `Across the ${lastRuns.length} most recent runs.`;
    }

    function renderRuns() {
      const tbody = document.getElementById('runs-body');
      const runs = lastRuns.filter(matchesFilters);
      renderKpis(runs);
      if (!lastRuns.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">No runs recorded yet. Runs appear here once a webhook or upload triggers the pipeline.</td></tr>';
        return;
      }
      if (!runs.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">No runs match these filters.<button type="button" class="clear-btn" data-clear>Clear filters</button></td></tr>';
        tbody.querySelector('[data-clear]').addEventListener('click', clearFilters);
        return;
      }
      // The table is rebuilt every refresh; remember which row had keyboard
      // focus so the 30s auto-refresh doesn't throw it back to the page.
      const focusedRun = document.activeElement?.closest?.('#runs-body tr.run-row')?.dataset.run;
      tbody.innerHTML = runs.map((run) => {
        const isOpen = expanded.has(run.runId);
        return `
          <tr class="run-row" data-run="${esc(run.runId)}">
            <td title="${esc(absTime(run.startedAt))}"><button type="button" class="expand-btn" aria-expanded="${isOpen}" aria-label="${isOpen ? 'Collapse' : 'Expand'} run details">${isOpen ? '&#9662;' : '&#9656;'}</button>${esc(relTime(run.startedAt))}</td>
            <td>${sourceBadge(run)}</td>
            <td class="wrap">${esc(runProject(run))}</td>
            <td class="wrap">${esc(runFile(run)) || '<span class="muted">—</span>'}</td>
            <td>${esc(run.cardType || run.cardTypeOverride || '—')}</td>
            <td>${verdictBadge(run)}</td>
            <td>${statusBadge(run)}</td>
            <td>${esc(fmtDuration(run))}</td>
            <td>${reportLinks(run)}</td>
          </tr>
          ${isOpen ? `<tr class="detail-row"><td colspan="9">${detailHtml(run)}</td></tr>` : ''}`;
      }).join('');

      tbody.querySelectorAll('tr.run-row').forEach((row) => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('a')) return; // let report links click through
          const id = row.dataset.run;
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          renderRuns();
        });
      });

      if (focusedRun) {
        const row = [...tbody.querySelectorAll('tr.run-row')].find((r) => r.dataset.run === focusedRun);
        row?.querySelector('.expand-btn')?.focus({ preventScroll: true });
      }
    }

    let lastRuns = [];
    let sessionExpired = false;

    // The admin cookie lasts 30 days; when it lapses the fetches start
    // returning 401. Stop the refresh loop and offer the way back in —
    // reloading the page serves the middleware's sign-in form.
    function handleSessionExpired() {
      if (sessionExpired) return;
      sessionExpired = true;
      document.getElementById('refresh-note').textContent = 'auto-refresh paused';
      document.getElementById('runs-body').innerHTML =
        '<tr><td colspan="9" class="empty">Your session expired. <a class="report-link" href="/admin">Sign in again</a></td></tr>';
    }

    async function loadRuns() {
      const tbody = document.getElementById('runs-body');
      try {
        const res = await fetch('/api/admin/runs?limit=100', { cache: 'no-store' });
        if (res.status === 401) return handleSessionExpired();
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { runs } = await res.json();
        lastRuns = runs;
        renderRuns();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="9" class="empty">Failed to load runs: ${esc(err.message)}</td></tr>`;
      }
    }

    // ── Refresh loop ────────────────────────────────────────
    let countdown = REFRESH_SECS;
    const refreshBtn = document.getElementById('refresh-btn');
    async function refreshAll() {
      countdown = REFRESH_SECS;
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Refreshing…';
      try {
        await Promise.all([loadHealth(), loadRuns()]);
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Refresh';
      }
    }
    setInterval(() => {
      if (sessionExpired) return;
      countdown -= 1;
      document.getElementById('refresh-note').textContent = `auto-refresh in ${countdown}s`;
      if (countdown <= 0) refreshAll();
    }, 1000);
    refreshBtn.addEventListener('click', refreshAll);
    refreshAll();
  </script>
</body>
</html>
